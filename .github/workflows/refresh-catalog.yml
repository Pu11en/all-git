name: refresh-catalog

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync deps
        run: uv sync --extra dev
      - name: Update catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run python scripts/export_bundled_catalog.py
      - name: Commit refreshed catalog
        run: |
          git config user.name "all-git-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/allgit/catalog.sqlite3
          git diff --cached --quiet || git commit -m "chore: refresh bundled catalog"
          git push
