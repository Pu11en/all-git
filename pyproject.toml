[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "all-git"
version = "0.1.0"
description = "Searchable local catalog of every repo featured by the GitHub Awesome channel, with timestamped evidence and self-updates."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "filelock>=3.20,<4",
  "mcp==2.0.0",
  "mcp-types==2.0.0",
  "platformdirs>=4.4,<5",
  "pydantic>=2.12,<3",
  "webvtt-py>=0.5,<1",
  "yt-dlp[default,deno]>=2026.7.4,<2027",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
all-git = "allgit.cli:main"
all-git-mcp = "allgit.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/allgit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
asyncio_mode = "auto"
markers = [
  "live: requires live network access",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]
